aid: department-of-better-technology
name: Department of Better Technology
description: >-
  The Department of Better Technology (DOBT), founded in 2013 by former Presidential Innovation
  Fellows and later acquired by CityBase, builds Screendoor — a form-building and submission-
  management platform used by government agencies and organizations such as ProPublica, the Los
  Angeles Times, the Consumer Financial Protection Bureau, and the Ford Foundation to run paperless
  intake, evaluation, and approval workflows. The Screendoor REST API programmatically manages
  sites, projects, forms and form fields, workflow statuses, labels, responses (submissions),
  response labels, and reviewer assignments, using API-key authentication, offset pagination with
  RFC 5988 Link headers, and an explicit API version.
